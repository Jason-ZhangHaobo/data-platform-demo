name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run ci
      - name: Verify deployable V2 Function Compute package
        run: |
          scripts/build-v2-fc-package.sh "$GITHUB_WORKSPACE/v2-function.zip"
          unzip -q v2-function.zip runtime/node -d /tmp/shuzhan-v2-ci
          chmod 0755 /tmp/shuzhan-v2-ci/runtime/node
          test "$(/tmp/shuzhan-v2-ci/runtime/node -p 'process.platform + "/" + process.arch')" = "linux/x64"
          /tmp/shuzhan-v2-ci/runtime/node -e 'import("node:sqlite").then(() => process.stdout.write("node:sqlite ready\n"))'
