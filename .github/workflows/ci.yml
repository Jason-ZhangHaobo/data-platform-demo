name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Set up Python for the existing SQL parser
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/spark-worker/requirements.txt
      - name: Install the existing SQL parser for lineage verification
        run: python3 -m pip install --require-hashes --no-deps --requirement deploy/sql-lineage-requirements.txt
      - name: Run quality gate
        run: npm run ci
      - name: Install the locked Spark runtime for the MySQL archive journey
        run: python3 -m pip install --require-hashes --no-deps --requirement deploy/spark-worker/requirements.txt
      - name: Verify MySQL source ingestion on the runner
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start mysql.service
          trap 'sudo systemctl stop mysql.service' EXIT
          reader_password="Se7!$(openssl rand -hex 24)"
          writer_password="Se7!$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$reader_password" "$writer_password"
          # The hosted runner image ships this local administrative socket account.
          MYSQL_PWD=root mysql --no-defaults --protocol=socket --user=root --batch <<SQL
          CREATE DATABASE shuduo_ingestion_test CHARACTER SET utf8mb4;
          CREATE USER 'shuduo_fixture_reader'@'127.0.0.1' IDENTIFIED BY '$reader_password';
          CREATE USER 'shuduo_fixture_writer'@'127.0.0.1' IDENTIFIED BY '$writer_password';
          GRANT SELECT ON \`shuduo\_ingestion\_test\`.* TO 'shuduo_fixture_reader'@'127.0.0.1';
          GRANT CREATE, SELECT, INSERT, UPDATE, ALTER ON shuduo_ingestion_test.fixture_holdings TO 'shuduo_fixture_writer'@'127.0.0.1';
          SQL
          JAVA_HOME="${JAVA_HOME_17_X64:?Runner JDK 17 is required}" \
            V2_PYTHON="$(command -v python3)" \
            SHUDUO_TEST_MYSQL_PORT=3306 \
            SHUDUO_TEST_MYSQL_READER_PASSWORD="$reader_password" \
            SHUDUO_TEST_MYSQL_WRITER_PASSWORD="$writer_password" \
            SHUDUO_WEALTH_REPORT_OUTPUT_DIR="$RUNNER_TEMP/shuduo-wealth-reports" \
            node --test scripts/accept-mysql-ingestion.mjs
          for filename in customer-001.csv customer-002.csv; do
            file="$RUNNER_TEMP/shuduo-wealth-reports/$filename"
            [[ -f "$file" && -s "$file" && ! -L "$file" ]]
          done
      - name: Package account-restricted workbench preview
        run: zip -qr "$RUNNER_TEMP/shuduo-private-preview.zip" web-dist scripts/run-v2-cloudshell-preview.mjs src/v2/private-service-routes.mjs src/v2/publication-request.mjs src/v2/service-plan-request.mjs
      - name: Retain credential-free private preview
        uses: actions/upload-artifact@v6
        with:
          name: shuduo-private-preview-${{ github.sha }}
          path: ${{ runner.temp }}/shuduo-private-preview.zip
          retention-days: 1
          if-no-files-found: error
      - name: Verify deployable V2 Function Compute package
        run: |
          scripts/build-v2-fc-package.sh "$GITHUB_WORKSPACE/v2-function.zip"
          package_root=$(mktemp -d "$RUNNER_TEMP/fc-invited-XXXXXX")
          unzip -q v2-function.zip -d "$package_root"
          chmod 0755 "$package_root/runtime/node"
          test "$("$package_root/runtime/node" -p 'process.platform + "/" + process.arch')" = "linux/x64"
          # Supply the test driver and fictional fixture only. All application
          # modules, dependencies, and the Node runtime come from the built ZIP.
          mkdir -p "$package_root/test/v2/fixtures"
          cp test/v2/invited-task-context.test.mjs "$package_root/test/v2/"
          cp test/v2/fixtures/agent-context-derivation.mjs "$package_root/test/v2/fixtures/"
          cd "$package_root"
          ./runtime/node --test test/v2/invited-task-context.test.mjs
      - name: Deliver the two fictional customer reports
        id: wealth_reports
        uses: actions/upload-artifact@v6
        with:
          name: shuduo-fictional-wealth-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shuduo-wealth-reports/customer-001.csv
            ${{ runner.temp }}/shuduo-wealth-reports/customer-002.csv
          retention-days: 7
          if-no-files-found: error
      - name: Show report download and file digests
        env:
          WEALTH_ARTIFACT_URL: ${{ steps.wealth_reports.outputs.artifact-url }}
        run: |
          set -euo pipefail
          checked_commit=$(git rev-parse HEAD)
          cd "$RUNNER_TEMP/shuduo-wealth-reports"
          {
            echo '## 财富顾问复刻结果'
            echo
            printf '[下载两位虚构客户的五指标报表](%s)\n\n' "$WEALTH_ARTIFACT_URL"
            printf '运行 %s，第 %s 次尝试，检出提交 `%s`。\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$checked_commit"
            echo '报表取自同一发布的第二批。隔离环境使用真实 MySQL 和 Spark、合成 SQL 生成器及虚构测试批准。'
            echo
            echo '每份 CSV 的 SHA-256'
            echo
            echo '```text'
            sha256sum -- customer-001.csv customer-002.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
