name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run ci
      - name: Package account-restricted workbench preview
        run: zip -qr "$RUNNER_TEMP/shuduo-private-preview.zip" web-dist scripts/run-v2-cloudshell-preview.mjs
      - name: Retain credential-free private preview
        uses: actions/upload-artifact@v6
        with:
          name: shuduo-private-preview-${{ github.sha }}
          path: ${{ runner.temp }}/shuduo-private-preview.zip
          retention-days: 1
          if-no-files-found: error
      - name: Verify deployable V2 Function Compute package
        run: |
          scripts/build-v2-fc-package.sh "$GITHUB_WORKSPACE/v2-function.zip"
          unzip -q v2-function.zip runtime/node -d /tmp/shuduo-v2-ci
          chmod 0755 /tmp/shuduo-v2-ci/runtime/node
          test "$(/tmp/shuduo-v2-ci/runtime/node -p 'process.platform + "/" + process.arch')" = "linux/x64"
          /tmp/shuduo-v2-ci/runtime/node -e 'import("node:sqlite").then(() => process.stdout.write("node:sqlite ready\n"))'
