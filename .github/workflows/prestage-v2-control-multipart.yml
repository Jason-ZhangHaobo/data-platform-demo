name: Prestage bounded V2 control package
on:
  workflow_dispatch:
    inputs:
      encrypted_plan:
        required: true
        type: string
      recipient_public_key:
        required: true
        type: string
      build_run_id:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      cleanup_only:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: v2-staging-control-mutation
  cancel-in-progress: false
jobs:
  prestage:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v2-staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALIBABA_CLOUD_REGION_ID: cn-hangzhou
      V2_DEPLOY_ROLE_ARN: ${{ vars.V2_DEPLOY_ROLE_ARN }}
      V2_DEPLOY_OIDC_PROVIDER_ARN: ${{ vars.V2_DEPLOY_OIDC_PROVIDER_ARN }}
      V2_FUNCTION_NAME: ${{ vars.V2_FUNCTION_NAME }}
      V2_MULTIPART_PLAN: ${{ inputs.encrypted_plan }}
      V2_MULTIPART_BUILD_RUN: ${{ inputs.build_run_id }}
      V2_MULTIPART_ARTIFACT_ID: ${{ inputs.artifact_id }}
      V2_MULTIPART_CLEANUP_ONLY: ${{ inputs.cleanup_only }}
      V2_AUDIT_RECIPIENT_KEY: ${{ inputs.recipient_public_key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate frozen artifact inputs
        run: node scripts/run-control-multipart-prestage.mjs validate-inputs
      - uses: actions/download-artifact@v6
        if: ${{ !inputs.cleanup_only }}
        with:
          run-id: ${{ inputs.build_run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          github-token: ${{ github.token }}
          path: .candidate
          merge-multiple: true
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: "3.5.1"
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ env.V2_DEPLOY_ROLE_ARN }}
          oidc-provider-arn: ${{ env.V2_DEPLOY_OIDC_PROVIDER_ARN }}
          role-session-name: github-actions-v2-control-prestage
          role-session-expiration: 2400
          audience: sts.aliyuncs.com
      - name: Prestage the authorized frozen package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/run-control-multipart-prestage.mjs transfer
      - name: Retain the sealed transfer receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shuduo-multipart-${{ github.run_id }}
          path: v2-control-multipart.sealed.json
          retention-days: 1
          if-no-files-found: error
