name: Sync private V2 MySQL connection secret
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: v2-staging-control-mutation
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: v2-staging
    env:
      ALIBABA_CLOUD_REGION_ID: cn-hangzhou
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: aliyun/setup-aliyun-cli-action@v1
        with:
          version: "3.4.11"
      - uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.V2_DEPLOY_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.V2_DEPLOY_OIDC_PROVIDER_ARN }}
          role-session-name: github-actions-v2-mysql-sync
          role-session-expiration: 900
          audience: sts.aliyuncs.com
      - name: Preserve all settings and replace only the MySQL connection secret
        env:
          FUNCTION_NAME: ${{ vars.V2_FUNCTION_NAME }}
          V2_MYSQL_PASSWORD: ${{ secrets.V2_MYSQL_PASSWORD }}
        run: node scripts/sync-v2-control-mysql-secret.mjs
