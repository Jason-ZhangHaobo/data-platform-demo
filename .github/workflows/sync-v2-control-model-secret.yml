name: Verify or sync the V2 control-plane model key
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the configured key, or apply one approved update
        type: choice
        options: [verify, apply]
        default: verify
        required: true
      expected_source_revision:
        description: Reviewed main commit SHA
        type: string
        required: true
      baseline_digest:
        description: Reviewed stable function fingerprint before synchronization
        type: string
        required: true
      preserved_digest:
        description: Reviewed function fingerprint with the model key field omitted
        type: string
        required: true
      exclusive_change_window:
        description: Apply only during the approved exclusive configuration window
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: v2-staging-control-mutation
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v2-staging
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ALIBABA_CLOUD_REGION_ID: cn-hangzhou
      V2_FUNCTION_NAME: ${{ vars.V2_FUNCTION_NAME }}
      V2_DEPLOY_ROLE_ARN: ${{ vars.V2_DEPLOY_ROLE_ARN }}
      V2_DEPLOY_OIDC_PROVIDER_ARN: ${{ vars.V2_DEPLOY_OIDC_PROVIDER_ARN }}
      V2_MODEL_SYNC_MODE: ${{ inputs.mode }}
      V2_EXPECTED_SOURCE: ${{ inputs.expected_source_revision }}
      V2_BASELINE_DIGEST: ${{ inputs.baseline_digest }}
      V2_PRESERVED_DIGEST: ${{ inputs.preserved_digest }}
      V2_EXCLUSIVE_CHANGE_WINDOW: ${{ inputs.exclusive_change_window }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the reviewed target and execution mode
        run: node scripts/run-v2-control-model-secret.mjs validate-inputs
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: "3.5.1"
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ env.V2_DEPLOY_ROLE_ARN }}
          oidc-provider-arn: ${{ env.V2_DEPLOY_OIDC_PROVIDER_ARN }}
          role-session-name: github-actions-v2-model-sync
          role-session-expiration: 900
          audience: sts.aliyuncs.com
      - name: Check the Beijing catalogue and reconcile the model key
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: node scripts/run-v2-control-model-secret.mjs
