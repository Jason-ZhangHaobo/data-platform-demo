name: Build V2 Spark worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build pinned PySpark worker package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: deploy/spark-worker/requirements.txt

      - name: Install locked application dependencies
        run: npm ci

      - name: Verify controller and Worker protocol
        run: node --test test/v2/remote-spark.test.mjs

      - name: Build FC package
        run: scripts/build-v2-spark-worker-package.sh "$GITHUB_WORKSPACE/v2-spark-worker.zip"

      - name: Inspect package without executing Spark
        run: |
          unzip -tq v2-spark-worker.zip
          unzip -l v2-spark-worker.zip | grep -q 'src/v2/remote-spark-worker.mjs'
          unzip -l v2-spark-worker.zip | grep -q 'python/pyspark/jars/spark-sql_2.12-3.5.9.jar'
          ! unzip -l v2-spark-worker.zip | grep -E '(^|/)(\.env|\.env\.local|[^/]+\.(pem|key))$'
          test "$(wc -c < v2-spark-worker.zip)" -le 503316480

      - name: Record the inner package digest
        run: |
          worker_digest="$(sha256sum v2-spark-worker.zip | cut -d' ' -f1)"
          test "${#worker_digest}" = 64
          echo "::notice title=Spark Worker inner SHA-256::$worker_digest"
          echo "Spark Worker inner SHA-256: $worker_digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived package for controlled cloud validation
        uses: actions/upload-artifact@v6
        with:
          name: shuzhan-v2-spark-worker-${{ github.sha }}
          path: v2-spark-worker.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
