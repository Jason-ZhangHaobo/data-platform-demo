name: Provision V2 staging function

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: v2-staging-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Create the dedicated V2 function only when absent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: v2-staging
    env:
      ALIBABA_CLOUD_REGION_ID: cn-hangzhou
      ALIYUN_ROLE_ARN: ${{ vars.V2_DEPLOY_ROLE_ARN }}
      ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.V2_DEPLOY_OIDC_PROVIDER_ARN }}
      FUNCTION_NAME: ${{ vars.V2_FUNCTION_NAME }}
      V2_FUNCTION_ROLE_ARN: ${{ vars.V2_FUNCTION_ROLE_ARN }}
      V2_VPC_ID: ${{ vars.V2_VPC_ID }}
      V2_VSW_ID: ${{ vars.V2_VSW_ID }}
      V2_SECURITY_GROUP_ID: ${{ vars.V2_SECURITY_GROUP_ID }}
      V2_PUBLIC_URL: ${{ vars.V2_PUBLIC_URL }}
      V2_PUBLIC_ORIGIN: ${{ vars.V2_PUBLIC_ORIGIN }}
      V2_PROVISIONING_ONLY: "true"
      OSS_BUCKET: ${{ vars.V2_OSS_BUCKET }}
      V2_MYSQL_HOST: ${{ secrets.V2_MYSQL_HOST }}
      V2_MYSQL_PORT: ${{ secrets.V2_MYSQL_PORT }}
      V2_MYSQL_USER: ${{ secrets.V2_MYSQL_USER }}
      V2_MYSQL_PASSWORD: ${{ secrets.V2_MYSQL_PASSWORD }}
      V2_MYSQL_DATABASE: ${{ secrets.V2_MYSQL_DATABASE }}
      V2_MYSQL_SOURCE_HOST: ${{ secrets.V2_MYSQL_SOURCE_HOST }}
      V2_MYSQL_SOURCE_PORT: ${{ secrets.V2_MYSQL_SOURCE_PORT }}
      V2_MYSQL_SOURCE_USER: ${{ secrets.V2_MYSQL_SOURCE_USER }}
      V2_MYSQL_SOURCE_PASSWORD: ${{ secrets.V2_MYSQL_SOURCE_PASSWORD }}
      V2_MYSQL_SOURCE_DATABASE: ${{ secrets.V2_MYSQL_SOURCE_DATABASE }}
      V2_MYSQL_SOURCE_TABLE_ALLOWLIST: ${{ vars.V2_MYSQL_SOURCE_TABLE_ALLOWLIST }}
      V2_MYSQL_SOURCE_SYNC_ENABLED: ${{ vars.V2_MYSQL_SOURCE_SYNC_ENABLED }}
      V2_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.V2_BOOTSTRAP_ADMIN_EMAIL }}
      V2_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${{ secrets.V2_BOOTSTRAP_ADMIN_PASSWORD_HASH }}
      V2_BOOTSTRAP_ADMIN_NAME: ${{ secrets.V2_BOOTSTRAP_ADMIN_NAME }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      V2_SPARK_EXECUTOR_URL: ${{ vars.V2_SPARK_EXECUTOR_URL }}
      V2_SPARK_EXECUTOR_SECRET: ${{ secrets.V2_SPARK_EXECUTOR_SECRET }}
      JASONSECRETS: ${{ secrets.JASONSECRETS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Expand optional JASONSECRETS bundle
        run: node scripts/export-v2-staging-secret-bundle.mjs

      - name: Validate protected configuration before any build or cloud access
        run: |
          node scripts/verify-v2-staging-config.mjs

      - name: Set up Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@v1
        with:
          version: "3.4.11"

      - name: Configure Alibaba Cloud credentials with GitHub OIDC
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ env.ALIYUN_ROLE_ARN }}
          oidc-provider-arn: ${{ env.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: github-actions-v2-provision
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Stop before build if the current bill or role boundary is unsafe
        run: |
          set -euo pipefail
          umask 077
          role_file="$(mktemp)"
          policies_file="$(mktemp)"
          vsw_file="$(mktemp)"
          sg_file="$(mktemp)"
          trap 'rm -f "$role_file" "$policies_file" "$vsw_file" "$sg_file"' EXIT
          spend="$(V2_HARD_MONTHLY_BUDGET_CNY=200 scripts/query-v2-monthly-spend.sh)"
          role_name="${V2_FUNCTION_ROLE_ARN##*/}"
          aliyun ram GetRole --RoleName "$role_name" > "$role_file"
          jq -e 'tostring | test("fc|functioncompute"; "i")' "$role_file" >/dev/null
          aliyun ram ListPoliciesForRole --RoleName "$role_name" > "$policies_file"
          ! jq -e 'tostring | test("AdministratorAccess|AliyunRAMFullAccess|AliyunAccountFullAccess|AliyunOSSFullAccess|AliyunRDSFullAccess|AliyunFCFullAccess|AliyunVPCFullAccess|AliyunECSFullAccess"; "i")' "$policies_file" >/dev/null
          aliyun vpc DescribeVSwitchAttributes --RegionId "$ALIBABA_CLOUD_REGION_ID" --VSwitchId "$V2_VSW_ID" > "$vsw_file"
          jq -e --arg vpc "$V2_VPC_ID" --arg vsw "$V2_VSW_ID" '.VSwitchId == $vsw and .VpcId == $vpc and .Status == "Available"' "$vsw_file" >/dev/null
          aliyun ecs DescribeSecurityGroups --RegionId "$ALIBABA_CLOUD_REGION_ID" --SecurityGroupId "$V2_SECURITY_GROUP_ID" > "$sg_file"
          jq -e --arg vpc "$V2_VPC_ID" --arg sg "$V2_SECURITY_GROUP_ID" 'any(.SecurityGroups.SecurityGroup[]; (.SecurityGroupId == $sg and .VpcId == $vpc))' "$sg_file" >/dev/null
          echo "V2_ACCOUNT_MONTHLY_SPEND_CNY=$spend" >> "$GITHUB_ENV"

      - name: Install locked development dependencies
        run: npm ci

      - name: Run complete quality gate
        run: npm run ci

      - name: Build and inspect the Linux x64 function package
        run: |
          scripts/build-v2-fc-package.sh "$GITHUB_WORKSPACE/v2-function.zip"
          mkdir -p /tmp/shuduo-v2-runtime-check
          unzip -q v2-function.zip runtime/node package.json -d /tmp/shuduo-v2-runtime-check
          chmod 0755 /tmp/shuduo-v2-runtime-check/runtime/node
          test "$(/tmp/shuduo-v2-runtime-check/runtime/node -p 'process.platform + "/" + process.arch')" = "linux/x64"
          /tmp/shuduo-v2-runtime-check/runtime/node -e 'import("node:sqlite").then(() => process.stdout.write("node:sqlite ready\n"))'
          unzip -l v2-function.zip | grep -q 'src/v2/cloud-server.mjs'
          unzip -l v2-function.zip | grep -q 'web-dist/index.html'
          unzip -l v2-function.zip | grep -q 'fixtures/sources/positions_baseline.csv'
          ! unzip -l v2-function.zip | grep -E '(^|/)(\.env|\.env\.local|[^/]+\.(pem|key))$'

      - name: Require the target function to be absent (never overwrite)
        run: |
          set -euo pipefail
          umask 077
          response_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -f "$response_file" "$error_file"' EXIT
          if aliyun fc GET "/2023-03-30/functions/$FUNCTION_NAME" --region "$ALIBABA_CLOUD_REGION_ID" >"$response_file" 2>"$error_file"; then
            echo 'The requested V2 function already exists; use the update workflow instead.' >&2
            exit 1
          fi
          code="$(node scripts/extract-aliyun-error-code.mjs "$response_file" "$error_file")"
          test "$code" = "FunctionNotFound" || { echo 'Target lookup failed without a confirmed not-found response' >&2; exit 1; }

      - name: Create the dedicated V2 function with minimum runtime settings
        run: |
          set -euo pipefail
          umask 077
          base64 -w 0 v2-function.zip > v2-function.zip.b64
          jq -n \
            --rawfile zip v2-function.zip.b64 \
            --arg function_name "$FUNCTION_NAME" \
            --arg role "$V2_FUNCTION_ROLE_ARN" \
            --arg public_origin "$V2_PUBLIC_ORIGIN" \
            --arg bucket "$OSS_BUCKET" \
            --arg mysql_host "$V2_MYSQL_HOST" \
            --arg mysql_port "${V2_MYSQL_PORT:-3306}" \
            --arg mysql_user "$V2_MYSQL_USER" \
            --arg mysql_password "$V2_MYSQL_PASSWORD" \
            --arg mysql_database "$V2_MYSQL_DATABASE" \
            --arg mysql_source_host "${V2_MYSQL_SOURCE_HOST:-}" \
            --arg mysql_source_port "${V2_MYSQL_SOURCE_PORT:-3306}" \
            --arg mysql_source_user "${V2_MYSQL_SOURCE_USER:-}" \
            --arg mysql_source_password "${V2_MYSQL_SOURCE_PASSWORD:-}" \
            --arg mysql_source_database "${V2_MYSQL_SOURCE_DATABASE:-}" \
            --arg mysql_source_tables "${V2_MYSQL_SOURCE_TABLE_ALLOWLIST:-}" \
            --arg mysql_source_sync "${V2_MYSQL_SOURCE_SYNC_ENABLED:-false}" \
            --arg admin_email "$V2_BOOTSTRAP_ADMIN_EMAIL" \
            --arg admin_password_hash "$V2_BOOTSTRAP_ADMIN_PASSWORD_HASH" \
            --arg admin_name "${V2_BOOTSTRAP_ADMIN_NAME:-平台管理员}" \
            --arg model_key "$DASHSCOPE_API_KEY" \
            --arg spark_url "${V2_SPARK_EXECUTOR_URL:-}" \
            --arg spark_secret "${V2_SPARK_EXECUTOR_SECRET:-}" \
            --arg vpc_id "$V2_VPC_ID" \
            --arg vsw_id "$V2_VSW_ID" \
            --arg security_group_id "$V2_SECURITY_GROUP_ID" \
            '{
              functionName:$function_name,
              description:"数舵V2证券数据平台专用试点函数",
              code:{zipFile:$zip},
              role:$role,
              runtime:"custom.debian12",
              handler:"not-used",
              cpu:0.25,
              memorySize:512,
              diskSize:512,
              timeout:120,
              instanceConcurrency:1,
              internetAccess:true,
              environmentVariables:{
                PORT:"9000",
                V2_LOCAL_DEVELOPMENT:"false",
                V2_PROVISIONING_ONLY:"true",
                V2_PRIVATE_SMOKE_ENABLED:"true",
                V2_PUBLIC_ORIGIN:$public_origin,
                V2_MYSQL_HOST:$mysql_host,
                V2_MYSQL_PORT:$mysql_port,
                V2_MYSQL_USER:$mysql_user,
                V2_MYSQL_PASSWORD:$mysql_password,
                V2_MYSQL_DATABASE:$mysql_database,
                V2_MYSQL_POOL_SIZE:"2",
                V2_MYSQL_CONNECT_TIMEOUT_MS:"5000",
                V2_MYSQL_CONNECT_ATTEMPTS:"6",
                V2_MYSQL_RETRY_DELAY_MS:"2000",
                V2_MYSQL_SOURCE_HOST:$mysql_source_host,
                V2_MYSQL_SOURCE_PORT:$mysql_source_port,
                V2_MYSQL_SOURCE_USER:$mysql_source_user,
                V2_MYSQL_SOURCE_PASSWORD:$mysql_source_password,
                V2_MYSQL_SOURCE_DATABASE:$mysql_source_database,
                V2_MYSQL_SOURCE_TABLE_ALLOWLIST:$mysql_source_tables,
                V2_MYSQL_SOURCE_SYNC_ENABLED:$mysql_source_sync,
                V2_MYSQL_SOURCE_MAX_ROWS:"5000",
                V2_MYSQL_SOURCE_MAX_BYTES:"4194304",
                V2_MYSQL_SOURCE_QUERY_TIMEOUT_MS:"15000",
                OSS_BUCKET:$bucket,
                OSS_ENDPOINT:"oss-cn-hangzhou-internal.aliyuncs.com",
                V2_OSS_STATE_OBJECT_KEY:"data-platform-demo/v2/state/project-securities-lab.json",
                V2_OSS_STATE_MAX_BYTES:"41943040",
                V2_OSS_ARTIFACT_PREFIX:"data-platform-demo/v2/artifacts",
                V2_BOOTSTRAP_ADMIN_EMAIL:$admin_email,
                V2_BOOTSTRAP_ADMIN_PASSWORD_HASH:$admin_password_hash,
                V2_BOOTSTRAP_ADMIN_NAME:$admin_name,
                DASHSCOPE_API_KEY:$model_key,
                V2_MODEL:"qwen3-coder-plus",
                V2_MODEL_BASE_URL:"https://dashscope.aliyuncs.com/compatible-mode/v1",
                V2_SPARK_EXECUTOR_URL:$spark_url,
                V2_SPARK_EXECUTOR_SECRET:$spark_secret,
                V2_SPARK_EXECUTOR_TIMEOUT_MS:"120000",
                V2_HARD_MONTHLY_BUDGET_CNY:"200",
                V2_MODEL_MONTHLY_BUDGET_CNY:"50",
                V2_MONTHLY_REMOTE_SPARK_SECONDS_LIMIT:"3600",
                V2_MONTHLY_REMOTE_SPARK_RUN_LIMIT:"200",
                V2_REMOTE_SPARK_RESERVATION_SECONDS:"30",
                V2_ACCOUNT_MONTHLY_SPEND_CNY:$ENV.V2_ACCOUNT_MONTHLY_SPEND_CNY
              },
              customRuntimeConfig:{port:9000,command:["/code/runtime/node"],args:["src/v2/cloud-server.mjs"]},
              vpcConfig:{vpcId:$vpc_id,vSwitchIds:[$vsw_id],securityGroupId:$security_group_id}
            }' > v2-function-create.json
          aliyun fc POST /2023-03-30/functions --region "$ALIBABA_CLOUD_REGION_ID" --body-file v2-function-create.json > v2-function-result.json
          jq -n '{reservedConcurrency:1}' > v2-function-concurrency.json
          aliyun fc PUT "/2023-03-30/functions/$FUNCTION_NAME/concurrency" --region "$ALIBABA_CLOUD_REGION_ID" --body-file v2-function-concurrency.json > v2-function-concurrency-result.json
          jq -e '.reservedConcurrency == 1' v2-function-concurrency-result.json >/dev/null
          jq -n '{
            minInstances:0,
            enableOnDemandScaling:true,
            scheduledPolicies:[],
            horizontalScalingPolicies:[],
            enableMixMode:false,
            requestDispatchPolicy:"Balanced"
          }' > v2-function-scaling.json
          aliyun fc PUT "/2023-03-30/functions/$FUNCTION_NAME/scaling-config" --region "$ALIBABA_CLOUD_REGION_ID" --body-file v2-function-scaling.json > v2-function-scaling-result.json
          jq -e '.minInstances == 0 and .enableOnDemandScaling == true' v2-function-scaling-result.json >/dev/null
          verified=false
          for attempt in $(seq 1 12); do
            if aliyun fc GET "/2023-03-30/functions/$FUNCTION_NAME" --region "$ALIBABA_CLOUD_REGION_ID" > v2-function-verified.json 2>/dev/null; then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = true
          jq -e --arg name "$FUNCTION_NAME" --arg role "$V2_FUNCTION_ROLE_ARN" --arg vpc "$V2_VPC_ID" --arg vsw "$V2_VSW_ID" --arg sg "$V2_SECURITY_GROUP_ID" \
            '.functionName == $name and .runtime == "custom.debian12" and .instanceConcurrency == 1 and .role == $role and .vpcConfig.vpcId == $vpc and (.vpcConfig.vSwitchIds | index($vsw) != null) and .vpcConfig.securityGroupId == $sg' \
            v2-function-verified.json >/dev/null
          aliyun fc GET "/2023-03-30/functions/$FUNCTION_NAME/concurrency" --region "$ALIBABA_CLOUD_REGION_ID" > v2-function-concurrency-verified.json
          jq -e '.reservedConcurrency == 1' v2-function-concurrency-verified.json >/dev/null
          aliyun fc GET "/2023-03-30/functions/$FUNCTION_NAME/scaling-config" --region "$ALIBABA_CLOUD_REGION_ID" > v2-function-scaling-verified.json
          jq -e '.minInstances == 0 and .enableOnDemandScaling == true' v2-function-scaling-verified.json >/dev/null

      - name: Remove generated files containing deployment secrets
        if: always()
        run: |
          rm -f v2-function.zip.b64 v2-function-create.json v2-function-result.json v2-function-verified.json
          rm -f v2-function-concurrency.json v2-function-concurrency-result.json v2-function-concurrency-verified.json
          rm -f v2-function-scaling.json v2-function-scaling-result.json v2-function-scaling-verified.json
          rm -rf /tmp/shuduo-v2-runtime-check
