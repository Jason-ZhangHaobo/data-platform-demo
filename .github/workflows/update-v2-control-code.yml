name: Update only V2 private control code
on:
  workflow_dispatch:
    inputs:
      authorization:
        required: true
        type: choice
        options: [NOT_AUTHORIZED, P0A_PRIVATE_CODE_ONLY, INVITED_READ_ONLY_CODE_REFRESH]
        default: NOT_AUTHORIZED
      expected_source_revision:
        required: true
        type: string
      recipient_public_key:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: v2-staging-control-mutation
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && (inputs.authorization == 'P0A_PRIVATE_CODE_ONLY' || inputs.authorization == 'INVITED_READ_ONLY_CODE_REFRESH')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: v2-staging
    env:
      V2_CONTROL_UPDATE_TARGET: ${{ secrets.V2_CONTROL_UPDATE_TARGET }}
      V2_CONTROL_UPDATE_APPROVED: ${{ inputs.authorization }}
      V2_CONTROL_OPERATOR_SHA: ${{ inputs.expected_source_revision }}
      V2_AUDIT_RECIPIENT_KEY: ${{ inputs.recipient_public_key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate scope and mask targets before credentials
        run: node scripts/control-code-transport.mjs --prepare
      - uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ env.V2_CONTROL_ARTIFACT_ID }}
          run-id: ${{ env.V2_CONTROL_BUILD_RUN }}
          github-token: ${{ github.token }}
          merge-multiple: true
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: '3.5.1'
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ env.V2_CONTROL_ROLE_ARN }}
          oidc-provider-arn: ${{ env.V2_CONTROL_PROVIDER_ARN }}
          role-session-name: github-actions-v2-code-only
          role-session-expiration: 1800
          audience: sts.aliyuncs.com
      - name: Verify rollback bytes and privately update only code
        timeout-minutes: 12
        run: node scripts/control-code-transport.mjs
      - name: Reconcile only an interrupted code update
        if: always()
        timeout-minutes: 3
        run: node scripts/control-code-transport.mjs --recover
      - name: Seal private evidence
        if: always()
        run: node scripts/control-code-transport.mjs --seal
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shuduo-control-update-${{ github.run_id }}
          path: v2-control-update.sealed.json
          retention-days: 1
          if-no-files-found: error
