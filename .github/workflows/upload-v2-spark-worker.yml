name: Upload V2 Spark worker package

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: v2-spark-worker-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload one immutable Worker object
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: v2-staging
    env:
      ALIBABA_CLOUD_REGION_ID: cn-hangzhou
      V2_DEPLOY_ROLE_ARN: ${{ vars.V2_DEPLOY_ROLE_ARN }}
      V2_DEPLOY_OIDC_PROVIDER_ARN: ${{ vars.V2_DEPLOY_OIDC_PROVIDER_ARN }}
      V2_OSS_BUCKET: ${{ vars.V2_OSS_BUCKET }}
      V2_SPARK_WORKER_PACKAGE_SHA256: ${{ vars.V2_SPARK_WORKER_PACKAGE_SHA256 }}
      V2_SPARK_WORKER_PACKAGE_BYTES: ${{ vars.V2_SPARK_WORKER_PACKAGE_BYTES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: deploy/spark-worker/requirements.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate immutable target configuration
        run: |
          set -euo pipefail
          account_id="$(printf '%s' "$V2_DEPLOY_ROLE_ARN" | sed -nE 's#^acs:ram::([0-9]{12,20}):role/[a-z0-9-]{1,64}$#\1#p')"
          test -n "$account_id"
          test "$ALIBABA_CLOUD_REGION_ID" = cn-hangzhou
          test -n "$V2_OSS_BUCKET"
          test "${#V2_SPARK_WORKER_PACKAGE_SHA256}" = 64
          test "$V2_SPARK_WORKER_PACKAGE_BYTES" = 318914420
          printf 'ALIYUN_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          printf 'V2_SPARK_WORKER_CODE_OBJECT=data-platform-demo/v2/spark-worker/%s.zip\n' "$V2_SPARK_WORKER_PACKAGE_SHA256" >> "$GITHUB_ENV"

      - name: Validate exact-object policy contract without applying it
        run: node scripts/render-v2-spark-worker-package-policy.mjs >/dev/null

      - name: Configure Alibaba Cloud credentials with GitHub OIDC
        id: aliyun
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ env.V2_DEPLOY_ROLE_ARN }}
          oidc-provider-arn: ${{ env.V2_DEPLOY_OIDC_PROVIDER_ARN }}
          role-session-name: github-actions-v2-spark-upload
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Install locked application dependencies
        run: npm ci

      - name: Verify Worker protocol
        run: node --test test/v2/remote-spark.test.mjs test/v2/spark-worker-w2-plan.test.mjs

      - name: Build exact Worker package
        run: |
          set -euo pipefail
          scripts/build-v2-spark-worker-package.sh "$GITHUB_WORKSPACE/v2-spark-worker.zip"
          actual_sha="$(sha256sum v2-spark-worker.zip | cut -d' ' -f1)"
          actual_bytes="$(wc -c < v2-spark-worker.zip | tr -d ' ')"
          test "$actual_sha" = "$V2_SPARK_WORKER_PACKAGE_SHA256"
          test "$actual_bytes" = "$V2_SPARK_WORKER_PACKAGE_BYTES"
          unzip -tq v2-spark-worker.zip

      - name: Install pinned ossutil 2.4.0
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/ossutil"
          mkdir -p "$tool_root"
          curl --fail --location --silent --show-error \
            --output "$tool_root/ossutil.zip" \
            https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip
          echo '85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  '"$tool_root/ossutil.zip" | sha256sum --check --status
          unzip -q "$tool_root/ossutil.zip" -d "$tool_root"
          chmod 0755 "$tool_root/ossutil-2.4.0-linux-amd64/ossutil"
          printf '%s\n' "$tool_root/ossutil-2.4.0-linux-amd64" >> "$GITHUB_PATH"

      - name: Upload only when the exact object is absent, then verify content
        env:
          OSS_ACCESS_KEY_ID: ${{ steps.aliyun.outputs.aliyun-access-key-id }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.aliyun.outputs.aliyun-access-key-secret }}
          OSS_SESSION_TOKEN: ${{ steps.aliyun.outputs.aliyun-security-token }}
          OSS_REGION: cn-hangzhou
          OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
        run: |
          set -euo pipefail
          umask 077
          head_file="$(mktemp)"
          head_error="$(mktemp)"
          upload_file="$(mktemp)"
          download_file="$(mktemp)"
          phase=HEAD_OBJECT
          diagnostic_file="$head_file"
          finish_upload() {
            result=$?
            if [ "$result" -ne 0 ]; then
              code="$(node scripts/extract-aliyun-error-code.mjs "$diagnostic_file" "$head_error")" || code=UNKNOWN_ALIYUN_ERROR
              printf '::error::Worker upload failed phase=%s exit=%s code=%s\n' "$phase" "$result" "$code"
            fi
            rm -f "$head_file" "$head_error" "$upload_file" "$download_file" v2-spark-worker.zip
            exit "$result"
          }
          trap finish_upload EXIT
          if ossutil api head-object --quiet \
            --bucket "$V2_OSS_BUCKET" \
            --key "$V2_SPARK_WORKER_CODE_OBJECT" \
            --output-format json >"$head_file" 2>"$head_error"; then
            V2_SPARK_WORKER_HEAD_EVIDENCE_FILE="$head_file" \
              node scripts/verify-v2-spark-worker-oss-object.mjs
          else
            code="$(node scripts/extract-aliyun-error-code.mjs "$head_file" "$head_error")"
            test "$code" = NoSuchKey || test "$code" = NoSuchObject
            phase=PUT_OBJECT
            diagnostic_file="$upload_file"
            ossutil api put-object --quiet \
              --bucket "$V2_OSS_BUCKET" \
              --key "$V2_SPARK_WORKER_CODE_OBJECT" \
              --body file://v2-spark-worker.zip \
              --metadata "shuduo-sha256=$V2_SPARK_WORKER_PACKAGE_SHA256" \
              --object-acl private \
              --forbid-overwrite true \
              --output-format json >"$upload_file" 2>"$head_error"
            phase=HEAD_AFTER_UPLOAD
            diagnostic_file="$head_file"
            ossutil api head-object --quiet \
              --bucket "$V2_OSS_BUCKET" \
              --key "$V2_SPARK_WORKER_CODE_OBJECT" \
              --output-format json >"$head_file" 2>"$head_error"
            V2_SPARK_WORKER_HEAD_EVIDENCE_FILE="$head_file" \
              node scripts/verify-v2-spark-worker-oss-object.mjs
          fi
          phase=DOWNLOAD_OBJECT
          diagnostic_file="$upload_file"
          : >"$upload_file"
          ossutil api get-object --quiet \
            --bucket "$V2_OSS_BUCKET" \
            --key "$V2_SPARK_WORKER_CODE_OBJECT" >"$download_file" 2>"$head_error"
          phase=VERIFY_DOWNLOADED_BYTES
          downloaded_sha="$(sha256sum "$download_file" | cut -d' ' -f1)"
          downloaded_bytes="$(wc -c < "$download_file" | tr -d ' ')"
          test "$downloaded_sha" = "$V2_SPARK_WORKER_PACKAGE_SHA256"
          test "$downloaded_bytes" = "$V2_SPARK_WORKER_PACKAGE_BYTES"

      - name: State the remaining W2 gate
        run: |
          echo 'Object bytes and SHA-256 are verified by download. Bucket policy, public-access block and object ACL still require the separate Cloud Shell privacy gate before FC creation.' >> "$GITHUB_STEP_SUMMARY"
