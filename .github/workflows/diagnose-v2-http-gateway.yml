name: Bounded V2 HTTP gateway diagnostic
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Explicit approval for at most three read-only gateway probes
        required: true
        type: choice
        options: [NOT_AUTHORIZED, THREE_READONLY_GATEWAY_PROBES]
        default: NOT_AUTHORIZED
      expected_source_revision:
        description: Reviewed main SHA with successful CI
        required: true
        type: string
      recipient_public_key:
        description: Base64 DER RSA public key for encrypted diagnostic evidence
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: v2-staging-control-mutation
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && inputs.authorization == 'THREE_READONLY_GATEWAY_PROBES'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: v2-staging
    env:
      V2_HTTP_DIAGNOSTIC_TARGET: ${{ secrets.V2_HTTP_DIAGNOSTIC_TARGET }}
      V2_HTTP_DIAGNOSTIC_AUTHORIZED: ${{ inputs.authorization }}
      V2_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.expected_source_revision }}
      V2_AUDIT_RECIPIENT_KEY: ${{ inputs.recipient_public_key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate scope and mask target before credentials
        run: node scripts/diagnose-v2-http-gateway.mjs --prepare
      - name: Install existing pinned official signing SDK
        run: python3 -m pip install --disable-pip-version-check --quiet alibabacloud-openapi-util==0.2.4 alibabacloud-tea==0.3.8 alibabacloud-tea-util==0.3.14
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: '3.5.1'
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ env.V2_DIAGNOSTIC_ROLE_ARN }}
          oidc-provider-arn: ${{ env.V2_DIAGNOSTIC_PROVIDER_ARN }}
          role-session-name: github-actions-v2-http-diagnostic
          role-session-expiration: 1800
          audience: sts.aliyuncs.com
      - name: Collect at most three fixed GET diagnostic results
        timeout-minutes: 7
        run: node scripts/diagnose-v2-http-gateway.mjs
      - name: Always remove the exact temporary trigger
        if: always()
        timeout-minutes: 3
        run: node scripts/diagnose-v2-http-gateway.mjs --cleanup
      - name: Seal evidence without logging gateway messages
        if: always()
        run: node scripts/diagnose-v2-http-gateway.mjs --seal
      - name: Retain encrypted diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shuduo-http-diagnostic-${{ github.run_id }}
          path: v2-http-diagnostic.sealed.json
          retention-days: 1
          if-no-files-found: error
