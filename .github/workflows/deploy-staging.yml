name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "s.yaml"
      - ".github/workflows/deploy-staging.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Aliyun FC staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    env:
      # These are resource identifiers, not credentials. Keeping them in the
      # workflow avoids a separate GitHub variable bootstrap step; the OIDC
      # trust policy still restricts use to this repository's staging env.
      ALIBABA_CLOUD_REGION_ID: cn-hangzhou
      ALIYUN_ROLE_ARN: acs:ram::1170828584875736:role/dataplatform-github-staging-deploy-role
      ALIYUN_OIDC_PROVIDER_ARN: acs:ram::1170828584875736:oidc-provider/github-actions-data-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run ci

      - name: Package function code
        run: |
          zip -qr function.zip src package.json package-lock.json node_modules
          test -s function.zip

      - name: Set up Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@v1
        with:
          version: "3.4.11"

      - name: Configure Alibaba Cloud credentials with GitHub OIDC
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ env.ALIYUN_ROLE_ARN }}
          oidc-provider-arn: ${{ env.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: github-actions-staging
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Update existing FC function
        env:
          FUNCTION_NAME: dataplatform-staging-api
          DEMO_ACCESS_TOKEN: ${{ secrets.DEMO_ACCESS_TOKEN }}
        run: |
          ZIP_B64="$(base64 -w 0 function.zip)"
          CURRENT_ENV="$(aliyun fc GetFunction --functionName "$FUNCTION_NAME" | jq -c '.environmentVariables // {}')"
          BODY="$(jq -n --arg zip "$ZIP_B64" --arg token "$DEMO_ACCESS_TOKEN" --argjson current "$CURRENT_ENV" \
            '$current + {DEMO_ACCESS_TOKEN: $token, REQUIRE_ACCESS_TOKEN: "false", CORS_ALLOW_ORIGIN: "https://jason-zhanghaobo.github.io"} | {code:{zipFile:$zip}, environmentVariables: ., vpcConfig:{vpcId:"vpc-bp1ndb4243ew96drhs8zv", vSwitchIds:["vsw-bp1e8fz4pfi0ed7kvp5zv"], securityGroupId:"sg-bp11iqykaweqpigltq44"}}')"
          aliyun fc UpdateFunction --functionName "$FUNCTION_NAME" --body "$BODY"

      - name: Verify staging health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://dataplaging-api-qagxeaqdmd.cn-hangzhou.fcapp.run/api/health \
            | tee health.json
          jq -e '.status == "ok" and .environment == "staging"' health.json

      - name: Verify staging read APIs
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://dataplaging-api-qagxeaqdmd.cn-hangzhou.fcapp.run/api/tasks \
            | tee tasks.json
          jq -e 'length >= 3 and (map(select(.enabled == true)) | length >= 2)' tasks.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://dataplaging-api-qagxeaqdmd.cn-hangzhou.fcapp.run/api/summary \
            | tee summary.json
          jq -e '.totalTasks >= 3 and .enabledTasks >= 2 and .runningTasks >= 0' summary.json
