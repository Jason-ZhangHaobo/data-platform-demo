name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/client/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R src/client/. _site/
          sed -i 's#globalThis.DATA_PLATFORM_API_BASE_URL = "";#globalThis.DATA_PLATFORM_API_BASE_URL = "https://dataplaging-api-qagxeaqdmd.cn-hangzhou.fcapp.run";#' _site/runtime-config.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
