edition: 3.0.0
name: data-platform-demo
access: default

vars:
  region: cn-hangzhou
  stage: ${env('DEPLOY_ENV')}
  bucket: ${env('OSS_BUCKET')}
  roleArn: ${env('FC_ROLE_ARN')}
  accessToken: ${env('DEMO_ACCESS_TOKEN')}
  requireAccessToken: ${env('REQUIRE_ACCESS_TOKEN')}
  corsAllowOrigin: ${env('CORS_ALLOW_ORIGIN')}

resources:
  web:
    component: fc3
    props:
      region: ${vars.region}
      # Keep deployments pointed at the single function created for each stage.
      # For the current staging-only setup this resolves to dataplatform-staging-api.
      functionName: dataplatform-${vars.stage}-api
      description: Fictional data platform demo for learning controlled delivery.
      runtime: custom.debian12
      code: ./
      handler: not-used
      memorySize: 256
      cpu: 0.1
      diskSize: 512
      timeout: 30
      instanceConcurrency: 10
      internetAccess: true
      role: ${vars.roleArn}
      vpcConfig:
        vpcId: vpc-bp1ndb4243ew96drhs8zv
        vSwitchIds:
          - vsw-bp1e8fz4pfi0ed7kvp5zv
        securityGroupId: sg-bp11iqykaweqpigltq44
      environmentVariables:
        PORT: "9000"
        APP_ENV: ${vars.stage}
        STORAGE_DRIVER: oss
        OSS_ENDPOINT: oss-cn-hangzhou-internal.aliyuncs.com
        OSS_BUCKET: ${vars.bucket}
        OSS_OBJECT_KEY: data-platform-demo/store.json
        DEMO_ACCESS_TOKEN: ${vars.accessToken}
        REQUIRE_ACCESS_TOKEN: ${vars.requireAccessToken}
        CORS_ALLOW_ORIGIN: ${vars.corsAllowOrigin}
        SIMULATION_DELAY_MS: "1200"
        PATH: /var/fc/lang/nodejs20/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      customRuntimeConfig:
        port: 9000
        command:
          - /var/fc/lang/nodejs20/bin/node
        args:
          - src/server/index.mjs
      triggers:
        - triggerName: http-trigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
